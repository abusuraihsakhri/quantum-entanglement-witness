name: Quantum Entanglement Witness CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Compile Python sources
        run: python -m compileall -q agents entanglement_witness cli.py enrichment.py simulator.py
      - name: Run tests
        env:
          AUDIT_SECRET_KEY: ci-test-audit-secret-key-32chars-long
        run: python -m pytest -q
      - name: Check package command
        env:
          AUDIT_SECRET_KEY: ci-test-audit-secret-key-32chars-long
        run: quantum-entanglement-witness --help
